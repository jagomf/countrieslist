# This workflow will publish a package to GitHub Packages when a release is created
# For more information see: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: Publish to NPM

on:
  release:
    types: [created]

permissions:
  id-token: write  # Required for OIDC: publishing to npm
  contents: read

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          registry-url: https://registry.npmjs.org/
      - run: npm install -g npm@latest  # OIDC trusted publishing requires npm >= 11.5.1
      - run: npm ci
      - run: npm run dist:publish
